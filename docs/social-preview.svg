  <line x1="840" y1="427" x2="840" y2="437" stroke="rgba(103,158,254,0.45)" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="814" y="440" width="362" height="56" rx="10" fill="#202027" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="830" y="464" font-size="14" font-weight="600" fill="#EAEAEF" id="t21">数据与存储</text>
  <text x="830" y="483" font-size="11" font-weight="400" fill="#8A8A98" id="t22">PG · Redis · MinIO</text>
