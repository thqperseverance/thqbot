# thqbot MVP — 基础设施编排
#
# 与 D19=A 的偏差（已确认）：
#   * Redis 复用宿主上已有的 `redis` 容器（发布在 127.0.0.1:6379），不再自建；
#     容器内经 host.docker.internal:6379 访问。
#   * MinIO 使用本地已导入的 minio/minio:latest 镜像（Docker Hub 直连被拒，
#     镜像由用户提供）；bucket 需先创建：scripts/init-minio.ps1。
#   * PostgreSQL 与 Kafka(KRaft 单节点) 由本文件自建。
name: thqbot

# 容器内的 127.0.0.1 指向容器自身；访问宿主代理必须用 host.docker.internal。
x-common-env: &common-env
  HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-http://host.docker.internal:7897}
  HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-http://host.docker.internal:7897}
  http_proxy: ${CONTAINER_HTTP_PROXY:-http://host.docker.internal:7897}
  https_proxy: ${CONTAINER_HTTPS_PROXY:-http://host.docker.internal:7897}
  NO_PROXY: ${CONTAINER_NO_PROXY:-postgres,kafka,host.docker.internal,localhost,127.0.0.1}
  no_proxy: ${CONTAINER_NO_PROXY:-postgres,kafka,host.docker.internal,localhost,127.0.0.1}

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

# 构建期也需要代理：镜像构建发生在容器里，读不到宿主的 HTTP_PROXY。
# 用与运行期相同的 CONTAINER_*_PROXY（指向 host.docker.internal）。
x-build-args: &build-args
  PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
  HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-}
  NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1}

services:
  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: thqbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thqbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thqbot_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-thqbot}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thqbot} -d ${POSTGRES_DB:-thqbot}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ------------------------------------------- Kafka (KRaft, 单节点, 无 SASL)
  kafka:
    image: apache/kafka:3.9.0
    container_name: thqbot-kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # 主题初始化：inbound / outbound 各 3 分区（D11=A：出站增加分区以便多副本消费）
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: thqbot-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      INBOUND_TOPIC: ${KAFKA_INBOUND_TOPIC:-icatmsg_inbound}
      OUTBOUND_TOPIC: ${KAFKA_OUTBOUND_TOPIC:-icatmsg_outbound}
      INBOUND_PARTITIONS: ${KAFKA_INBOUND_PARTITIONS:-3}
      OUTBOUND_PARTITIONS: ${KAFKA_OUTBOUND_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka:9092
        K=/opt/kafka/bin
        echo "waiting for broker..."
        for i in $$(seq 1 40); do
          $$K/kafka-topics.sh --bootstrap-server $$BS --list >/dev/null 2>&1 && break
          sleep 2
        done
        $$K/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic "$$INBOUND_TOPIC" --partitions "$$INBOUND_PARTITIONS" --replication-factor 1
        $$K/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic "$$OUTBOUND_TOPIC" --partitions "$$OUTBOUND_PARTITIONS" --replication-factor 1
        echo "--- topics ---"
        $$K/kafka-topics.sh --bootstrap-server $$BS --list
        echo "kafka-init done"

  # --------------------------------------------------------------------- MinIO
  # 镜像 minio/minio:latest 来自本地导入（Docker Hub 直连被拒）。
  # bucket 由 scripts/init-minio.ps1 创建。
  minio:
    image: minio/minio:latest
    container_name: thqbot-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ------------------------------------- gateway：单应用后端（登录/会话/SSE/静态前端）
  gateway:
    build:
      context: ./services/gateway
      args: *build-args
    container_name: thqbot-gateway
    working_dir: /app
    command: ["/bin/sh", "-lc", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    environment:
      <<: *common-env
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thqbot}:${POSTGRES_PASSWORD:-thqbot_dev_pw}@postgres:5432/${POSTGRES_DB:-thqbot}
      APP_REDIS_URI: redis://host.docker.internal:6379/0
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_INBOUND_TOPIC: ${KAFKA_INBOUND_TOPIC:-icatmsg_inbound}
      APP_KAFKA_OUTBOUND_TOPIC: ${KAFKA_OUTBOUND_TOPIC:-icatmsg_outbound}
      APP_KAFKA_OUTBOUND_GROUP: ${KAFKA_OUTBOUND_GROUP:-thqbot-gateway}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-dev-session-secret-change-me}
      APP_AUTH_USERS: ${APP_AUTH_USERS:-}
      APP_AGENT_TENANT_ID: ${APP_AGENT_TENANT_ID:-thqbot}
      APP_AGENT_BOT_ID: ${APP_AGENT_BOT_ID:-bot_A}
      APP_MINIO_ENDPOINT: ${MINIO_CONTAINER_ENDPOINT:-minio:9000}
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: ${MINIO_BUCKET:-ithqbot-storage}
      APP_MINIO_SECURE: "false"
      APP_WEB_DIST_DIR: ${APP_WEB_DIST_DIR:-/app/web}
    extra_hosts: *extra-hosts
    ports:
      - "${GATEWAY_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ------------------------------------------------- ithqbot：agent worker（Kafka 消费）
  ithqbot:
    build:
      context: ./services/ithqbot
      args: *build-args
    container_name: thqbot-ithqbot
    working_dir: /workspace
    entrypoint: ["/entrypoint.sh"]
    command:
      - runtime
      - --config
      - /root/.ithqbot/config.json
      - --health-port
      - "9002"
      - --with-channels
      - --with-cron
      - --without-heartbeat
    environment:
      <<: *common-env
      PYTHONPATH: /workspace
      POSTGRES_USER: ${POSTGRES_USER:-thqbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thqbot_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-thqbot}
      POSTGRES_HOST: postgres
      KAFKA_SERVERS: kafka:9092
      REDIS_HOST: host.docker.internal
      ITHQBOT_WORKSPACE: /workspace/workspace
      ITHQBOT_SHARED_WORKSPACE: /workspace/workspace/shared
      KAFKA_INBOUND_TOPIC: ${KAFKA_INBOUND_TOPIC:-icatmsg_inbound}
      KAFKA_OUTBOUND_TOPIC: ${KAFKA_OUTBOUND_TOPIC:-icatmsg_outbound}
      MINIO_ENDPOINT: ${MINIO_CONTAINER_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ithqbot-storage}
      MINIO_SECURE: "false"
      APP_MINIO_ENDPOINT: ${MINIO_CONTAINER_ENDPOINT:-minio:9000}
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: ${MINIO_BUCKET:-ithqbot-storage}
      APP_MINIO_SECURE: "false"
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-}
    extra_hosts: *extra-hosts
    volumes:
      # 工作区以 bind mount 提供，便于随仓库携带演示文档（doc_compare 需要本地文件）
      - ./services/ithqbot/workspace:/workspace/workspace
    ports:
      - "${ITHQBOT_HEALTH_PORT:-9002}:9002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  kafkadata:
  miniodata:
